# =============================================================================
# Nginx vhost — pdf.as7th.com (Central PDF Service)
# =============================================================================
#
# ⚠️ فقط سایت جدید. این فایل هیچ سایت دیگری را تغییر نمی‌دهد و نباید
#    کانفیگ سایت‌های موجود (sites-available/sites-enabled دیگر) را
#    overwrite/حذف کند. فعال‌سازی همیشه با `systemctl reload nginx` انجام شود،
#    نه `restart`، تا اتصال سایت‌های دیگر قطع نشود.
#
# محل نصب:
#   sudo cp deploy/nginx/pdf.as7th.com.conf /etc/nginx/sites-available/pdf.as7th.com.conf
#   sudo ln -sf /etc/nginx/sites-available/pdf.as7th.com.conf \
#               /etc/nginx/sites-enabled/pdf.as7th.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# پیش‌نیاز SSL (گام ۱۰ docs/DEPLOYMENT.md):
#   گواهی Let's Encrypt برای pdf.as7th.com (certbot webroot) یا گواهی دستی.
#   اگر گواهی هنوز صادر نشده است، بلوک HTTPS (:443) را کامنت کنید، فقط با
#   بلوک HTTP (:80) سرویس را بالا بیاورید، گواهی را بگیرید، سپس بلوک HTTPS را
#   فعال کنید. مسیرهای گواهی زیر را مطابق گواهی واقعی سرور تنظیم کنید.
#
# PHP-FPM: نسخه در این فایل 8.5 است؛ اگر سرور نسخهٔ دیگری دارد، مقدار
#   fastcgi_pass را با socket واقعی (مثلاً /run/php/php8.4-fpm.sock) هماهنگ کنید.
#
# مسیر پروژه: /var/www/pdf-service  |  دامنه: https://pdf.as7th.com
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP :80 — فقط ACME challenge + ریدایرکت دائمی به HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pdf.as7th.com;

    # برای دریافت/تمدید گواهی certbot با webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS :443 — سرویس اصلی
# -----------------------------------------------------------------------------
server {
    # Ubuntu 22.04 / nginx 1.18: از سینتکس زیر استفاده می‌شود.
    # در nginx >= 1.25 می‌توانید `listen 443 ssl;` + `http2 on;` بنویسید.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name pdf.as7th.com;

    root /var/www/pdf-service/public;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # -------------------------------------------------------------------------
    # SSL — گواهی certbot (Let's Encrypt)
    # اگر گواهی هنوز صادر نشده، این دو خط را کامنت کنید و ابتدا بلوک HTTP را
    # فعال نگه دارید (گام ۱۰ DEPLOYMENT.md).
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/pdf.as7th.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.as7th.com/privkey.pem;

    # گواهی دستی/سازمانی: مسیرهای بالا را با مسیر واقعی جایگزین کنید، مثلاً:
    # ssl_certificate     /etc/ssl/certs/pdf.as7th.com-fullchain.pem;
    # ssl_certificate_key /etc/ssl/private/pdf.as7th.com-privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL_pdf:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — بعد از اطمینان از صحت HTTPS فعال است. برای اولین راه‌اندازی
    # می‌توانید مقدار max-age را موقتاً کم (مثلاً 300) بگذارید.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------------------------
    # هدرهای امنیتی
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP: به‌دلیل استفادهٔ Swagger UI (CDN) و اسکریپت‌های inline پنل، به‌صورت
    # پیش‌فرض فعال نیست. در صورت تنظیم دقیق CSP، این خط را باز کنید:
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # -------------------------------------------------------------------------
    # محدودیت حجم و زمان‌ها (هماهنگ با PDF_MAX_UPLOAD_KB / GOTENBERG_TIMEOUT)
    # -------------------------------------------------------------------------
    # payload API به‌طور پیش‌فرض 1MB و آپلود asset تا 5MB است؛ 12m با
    # post_max_size=10M / upload_max_filesize=8M در PHP-FPM هماهنگ است.
    client_max_body_size 12m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 180s;

    # Laravel باید تا پایان رندر (هم‌زمان) منتظر بماند؛ باید > GOTENBERG_TIMEOUT (90s)
    # و کمی بیشتر از request_terminate_timeout=300 در PHP-FPM باشد.
    fastcgi_connect_timeout 10s;
    fastcgi_send_timeout 310s;
    fastcgi_read_timeout 310s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 64k;

    # -------------------------------------------------------------------------
    # لاگ‌ها
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/pdf.as7th.com.access.log;
    error_log  /var/log/nginx/pdf.as7th.com.error.log warn;

    # -------------------------------------------------------------------------
    # استاتیک‌ها: build assets و favicon/robots (کش طولانی)
    # دقت: فایل‌های PDF هرگز از این مسیرها سرو نمی‌شوند (storage خصوصی).
    # -------------------------------------------------------------------------
    location ^~ /build/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:css|js|woff2|woff|ttf|otf)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # -------------------------------------------------------------------------
    # جلوگیری از دسترسی به فایل‌های حساس/مخفی
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(?:\.env.*|\.git.*|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan|phpunit\.xml|vite\.config\.js|README\.md|storage/app/private) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }

    # -------------------------------------------------------------------------
    # Laravel front controller
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # health routeها بدون کش
    location = /up {
        try_files $uri /index.php?$query_string;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/v1/health {
        try_files $uri /index.php?$query_string;
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # (اختیاری) محدودیت نرخ لبه برای API — در صورت نیاز باز کنید.
    # تعریف zone باید در context http باشد (مثلاً nginx.conf)، پس در این فایل
    # کامنت است تا با سایت‌های دیگر تداخل نکند:
    #
    #   limit_req_zone $binary_remote_addr zone=pdf_api:10m rate=120r/m;
    # و در location /api/:
    #   limit_req zone=pdf_api burst=30 nodelay;
    #   limit_req_status 429;
    # -------------------------------------------------------------------------
}
